<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>จองห้องประชุม - รร.วัดป้อมวิเชียรโชติการาม</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <a href="index.html" class="back-link">🏠 กลับหน้าหลัก</a>
            <h2>แบบฟอร์มจองห้องประชุม</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>วันที่ต้องการจอง</label>
                    <input type="date" id="date" name="วันที่จอง" required onchange="checkAvailability()">
                </div>
                <div class="form-group">
                    <label>ชื่อห้องประชุม</label>
                    <select id="room" name="ชื่อห้องประชุม" required onchange="checkAvailability()">
                        <option value=\"\">-- เลือกห้อง --</option>
                        <option value="ห้องดาหลา">ห้องดาหลา</option>
                        <option value="ห้องพวงคราม">ห้องพวงคราม</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>เวลาเริ่มจอง</label>
                    <select id="startTime" name="startTime" required onchange="updateEndTime()">
                        <option value="">-- เลือกวันที่และห้องก่อน --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>เวลาสิ้นสุด</label>
                    <select id="endTime" name="endTime" required>
                        <option value="">-- เลือกเวลาเริ่มจองก่อน --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ชื่อผู้จอง</label>
                    <input type="text" name="ชื่อผู้จอง" required>
                </div>
                <div class="form-group">
                    <label>เบอร์ติดต่อ</label>
                    <input type="tel" name="เบอร์ติดต่อ" required>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">ยืนยันการจอง</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
